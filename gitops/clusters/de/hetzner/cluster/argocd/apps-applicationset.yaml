# The single generator: one Application per apps/<name>/app.yaml (+ policy/app.yaml).
# Schema and semantics are specified in WEP-0001 (docs/wep/0001-rfc-gitops-flux-to-argocd.md):
# helm:/kustomize:/manifests: compose freely into one multi-source Application,
# synced as a single unit. No cross-app ordering is encoded -- apps whose CRDs
# aren't in place yet fail sync and converge via the retry policy below.
#
# The uniform parts live in the struct template; the variable-shaped sources
# block is a templatePatch -- ApplicationSet's struct template cannot emit
# conditional/variable-length source lists (templating only applies to string
# fields; templatePatch exists precisely for this).
apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: apps
  namespace: argocd
spec:
  goTemplate: true
  generators:
    - git:
        repoURL: https://github.com/willpxxr/willpxxr-live.git
        revision: main
        files:
          - path: "gitops/clusters/de/hetzner/cluster/apps/*/app.yaml"
          - path: "gitops/clusters/de/hetzner/cluster/policy/app.yaml"
  template:
    metadata:
      name: "{{ .name }}"
      finalizers:
        - resources-finalizer.argocd.argoproj.io
    spec:
      project: default
      destination:
        server: https://kubernetes.default.svc
      syncPolicy:
        # WEP-0001 phase 3: automated sync enabled after the phase-2 diff
        # review. selfHeal+prune make ArgoCD the sole reconciler; helm
        # releases are adopted in place (matching releaseNames).
        automated:
          selfHeal: true
          prune: true
        syncOptions:
          - CreateNamespace=true
          - ServerSideApply=true
        retry:
          limit: 5
          backoff:
            duration: 30s
            factor: 2
            maxDuration: 10m
  # hasKey guards everywhere an app.yaml may omit a key -- goTemplate is
  # strict about missing map keys. .path.path is the generator-provided app
  # dir (the directory containing the matched app.yaml). Inside
  # `{{ range .helm }}` the dot rebinds to the helm entry -- use $.path.path
  # there ($ is the template root). All sequence items are emitted at one
  # consistent indent so the patch is always valid YAML.
  templatePatch: |
    spec:
      {{- if and (hasKey . "namespace") .namespace }}
      destination:
        namespace: {{ .namespace }}
      {{- end }}
      sources:
      {{- if and (hasKey . "helm") .helm }}
        - repoURL: https://github.com/willpxxr/willpxxr-live.git
          targetRevision: main
          ref: app
        {{- range .helm }}
        - repoURL: {{ .repoURL }}
          {{- if and (hasKey . "chart") .chart }}
          chart: {{ .chart }}
          {{- end }}
          {{- if .version }}
          targetRevision: "{{ .version }}"
          {{- else }}
          # targetRevision is REQUIRED for helm sources (empty or omitted
          # both fail spec validation) -- "*" is the semver any-version
          # constraint, i.e. track latest (RSIP parity).
          targetRevision: "*"
          {{- end }}
          helm:
            releaseName: {{ .releaseName }}
            {{- if hasKey . "values" }}
            valueFiles:
              # $app values resolution is repo-root-relative in this ArgoCD
              # version (the ref source's own path is ignored) -- hence the
              # full path, not just the values filename.
              - $app/{{ $.path.path }}/{{ .values }}
            {{- end }}
        {{- end }}
      {{- end }}
      {{- if and (hasKey . "kustomize") .kustomize }}
        {{- range .kustomize }}
        - repoURL: {{ .repoURL }}
          targetRevision: "{{ .revision }}"
          {{- if hasKey . "path" }}
          path: {{ .path }}
          {{- else }}
          # No explicit path: git-local kustomize dir == the app dir, the
          # one render-time hook plain manifests lack (ArgoCD 3.x removed
          # the jsonnet source type; CRD-verified against v3.5.2).
          path: {{ $.path.path }}
          {{- end }}
          {{- if or (hasKey . "commonAnnotations") (hasKey . "images") (hasKey . "enableHelm") }}
          kustomize:
            {{- if hasKey . "commonAnnotationsEnvsubst" }}
            commonAnnotationsEnvsubst: {{ .commonAnnotationsEnvsubst }}
            {{- end }}
            {{- if and (hasKey . "enableHelm") .enableHelm }}
            enableHelm: {{ .enableHelm }}
            {{- end }}
            {{- if and (hasKey . "commonAnnotations") .commonAnnotations }}
            commonAnnotations:
            {{- range $k, $v := .commonAnnotations }}
              {{ $k }}: {{ $v }}
            {{- end }}
            {{- end }}
            {{- if and (hasKey . "images") .images }}
            images:
            {{- range .images }}
              - {{ . }}
            {{- end }}
            {{- end }}
          {{- end }}
        {{- end }}
      {{- end }}
      {{- if and (hasKey . "manifests") .manifests }}
        - repoURL: https://github.com/willpxxr/willpxxr-live.git
          targetRevision: main
          path: {{ .path.path }}
          directory:
            include: "{ {{- range $i, $e := .manifests }}{{ if $i }},{{ end }}{{ $e }}{{- end -}} }"
      {{- end }}
