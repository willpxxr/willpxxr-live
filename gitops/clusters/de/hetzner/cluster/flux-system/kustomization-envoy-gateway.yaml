---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: envoy-gateway
  namespace: flux-system
spec:
  interval: 10m0s
  path: "./gitops/clusters/de/hetzner/cluster/apps/envoy-gateway"
  # ArgoCD app metadata + helm values file (WEP-0001) -- not Kubernetes
  # manifests; this dir has no kustomization.yaml, so the build auto-scans it.
  ignore: |
    /app.yaml
    /values.yaml
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
  wait: true
  healthChecks:
    - apiVersion: helm.toolkit.fluxcd.io/v2
      kind: HelmRelease
      name: envoy-gateway
      namespace: flux-system
