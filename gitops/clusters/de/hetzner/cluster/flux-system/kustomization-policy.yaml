---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: policy
  namespace: flux-system
spec:
  interval: 10m0s
  path: "./gitops/clusters/de/hetzner/cluster/policy"
  # ArgoCD app metadata (WEP-0001) -- not a Kubernetes manifest.
  ignore: |
    /app.yaml
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
  wait: true
