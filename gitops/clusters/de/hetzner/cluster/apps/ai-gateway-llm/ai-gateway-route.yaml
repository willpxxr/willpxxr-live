---
apiVersion: aigateway.envoyproxy.io/v1beta1
kind: AIGatewayRoute
metadata:
  name: ai-gateway-llm
  namespace: envoy-gateway-system
spec:
  parentRefs:
    - name: gateway
      namespace: envoy-gateway-system
      sectionName: plaintext
    - name: gateway
      namespace: envoy-gateway-system
      sectionName: tls
  hostnames:
    - "ai.tailb40090.ts.net"
    - "ai.internal.willpxxr.com"
  rules:
    # Explicit model match (x-ai-eg-model, extracted from the request
    # body's model field before routing) rather than a catch-all, so the
    # upstream only ever sees model names it can actually serve. One
    # RegularExpression rule (RE2 syntax, confirmed supported via the live
    # CRD schema) deliberately covering both of Synthetic's id families --
    # syn:* curated aliases and hf:* per-HuggingFace-repo ids, confirmed
    # live via api.synthetic.new's /v1/models -- so newly-added models
    # route with no config change. Synthetic has no server-side model
    # allowlist to keep in sync, and it's flat-rate, so there's no
    # per-model cost exposure to gating.
    #
    # The regex requires the value to START with syn:/hf:, which is what
    # keeps it unambiguous against ai-gateway-route-synthetic-anthropic.yaml's
    # "anthropic:"-prefixed matches (same hostname/parentRef, disambiguated
    # purely by these header matches).
    - matches:
        - headers:
            - name: x-ai-eg-model
              type: RegularExpression
              value: '^(syn|hf):.+$'
      backendRefs:
        - name: synthetic
      # The controller defaults generated HTTPRoutes to a 60s total request
      # deadline (timeouts.request nil => 60s, per the AIGatewayRoute API
      # docs, not Envoy Gateway's 15s) -- long streaming completions get
      # killed mid-stream at exactly 60s (access log: response_flags UT,
      # response_code_details response_timeout, response_code 200 with
      # ~825KB already sent). 10m is generous headroom over any realistic
      # completion; genuinely stuck streams are bounded by Envoy's default
      # streamIdleTimeout (5m), which fires on 5m of zero bytes either way.
      timeouts:
        request: 10m
