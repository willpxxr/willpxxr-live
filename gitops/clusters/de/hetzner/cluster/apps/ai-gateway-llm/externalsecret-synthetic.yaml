---
# Synthetic (synthetic.new) has no Terraform provider, so unlike the
# Terraform-written items (tailscale.tf, betterstack.tf) the real key is
# pasted by hand: synthetic.tf creates the 1Password item (`synthetic` in
# the `kubernetes` vault, `credentials` section, `api_key` field) with a
# placeholder, and the actual API key replaces it in the 1Password app
# afterwards.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: synthetic
  namespace: envoy-gateway-system
spec:
  # 6h: 1Password service-account rate limits are tight; secrets are
  # stable and rotations are git-driven (force-sync for on-demand).
  refreshInterval: 6h
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword
  target:
    name: synthetic
    creationPolicy: Owner
  data:
    - secretKey: apiKey
      remoteRef:
        key: synthetic/credentials/api_key
