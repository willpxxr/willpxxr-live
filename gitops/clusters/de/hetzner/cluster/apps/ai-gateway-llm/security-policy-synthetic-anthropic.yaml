---
# Same requirement as security-policy.yaml (llm:use, same JWT provider),
# just targeting the synthetic-anthropic route's generated HTTPRoute. The
# extra x-api-key extraction is for crush's native Anthropic provider,
# which sends the token via x-api-key rather than Authorization:Bearer.
apiVersion: gateway.envoyproxy.io/v1alpha1
kind: SecurityPolicy
metadata:
  name: ai-gateway-llm-synthetic-anthropic
  namespace: envoy-gateway-system
spec:
  targetRefs:
    - group: gateway.networking.k8s.io
      kind: HTTPRoute
      name: ai-gateway-llm-synthetic-anthropic
  jwt:
    providers:
      - name: auth0
        issuer: "https://auth.willpxxr.com/"
        remoteJWKS:
          uri: "https://auth.willpxxr.com/.well-known/jwks.json"
        audiences:
          - "https://ai.internal.willpxxr.com"
        extractFrom:
          headers:
            - name: Authorization
              valuePrefix: "Bearer "
            - name: x-api-key
  authorization:
    defaultAction: Deny
    rules:
      - action: Allow
        principal:
          jwt:
            provider: auth0
            scopes:
              - "llm:use"
