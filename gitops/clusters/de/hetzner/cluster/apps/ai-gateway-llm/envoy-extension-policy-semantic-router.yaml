---
apiVersion: gateway.envoyproxy.io/v1alpha1
kind: EnvoyExtensionPolicy
metadata:
  name: semantic-router
  namespace: envoy-gateway-system
spec:
  # Target the AI gateway's GENERATED LLM HTTPRoutes directly: a
  # Gateway-scoped policy attaches per-route configs to non-AI routes only
  # (the AI controller owns its routes' filter configs — verified in the
  # envoy config dump: 0 attachments on the LLM routes). Per-route keys are
  # policy-scoped, so both extprocs coexist on these routes.
  targetRefs:
    - group: gateway.networking.k8s.io
      kind: HTTPRoute
      name: ai-gateway-llm
    - group: gateway.networking.k8s.io
      kind: HTTPRoute
      name: ai-gateway-llm-synthetic-anthropic
  extProc:
    - backendRefs:
        - group: ""
          kind: Service
          name: semantic-router
          namespace: vllm-semantic-router-system
          port: 50051
          # Match the controller's default explicitly — keeps live == git
          # without an ignoreDifferences entry (the plain-[] jq form broke
          # the diff normalizer; see the reverted argocd-values section).
          weight: 1
      # The classifier needs the full prompt body.
      processingMode:
        request:
          body: Buffered
      # If vSR is down, pass the request through with the client's original
      # model rather than failing the gateway (availability > routing).
      failOpen: true
      messageTimeout: 5s
