---
# Token for the Hetzner Cloud API, from the Terraform-managed 1Password item
# (hetzner.tf: onepassword_item.hcloud_csi). The chart expects a Secret named
# `hcloud` with key `token` in the release namespace.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: hcloud
  namespace: hcloud-csi
spec:
  # 6h: 1Password service-account rate limits are tight; secrets are
  # stable and rotations are git-driven (force-sync for on-demand).
  refreshInterval: 6h
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword
  target:
    name: hcloud
    creationPolicy: Owner
  data:
    - secretKey: token
      remoteRef:
        key: hcloud-csi/credentials/token
