# ArgoCD app definition (see argocd/apps-applicationset.yaml + WEP-0001).
name: tailscale-operator
namespace: tailscale
dir: apps/tailscale-operator  # cluster-relative app dir (appset prefixes the cluster path; used for
                  # the dir source + $app valueFiles)
helm:
  - repoURL: https://pkgs.tailscale.com/helmcharts
    chart: tailscale-operator
    version: ""
    releaseName: tailscale-tailscale-operator
    values: values.yaml
manifests:
  - network-policy.yaml
  - proxygroup.yaml
