---
apiVersion: aigateway.envoyproxy.io/v1beta1
kind: MCPRoute
metadata:
  name: ai-gateway-mcp
  namespace: envoy-gateway-system
spec:
  parentRefs:
    - name: gateway
      namespace: envoy-gateway-system
      sectionName: tls
  # v1.1: places the generated route in the per-host vhost (instead of the
  # wildcard vhost it lost in the v1.1 regeneration) and is what
  # external-dns reads -- this makes the mcp-dns-shim route obsolete.
  hostnames:
    - "mcp.internal.willpxxr.com"
  path: "/mcp"
  backendRefs:
    - name: kiwi
      kind: Backend
      group: gateway.envoyproxy.io
      path: "/"
      # Deliberately no forwardHeaders here -- the incoming client's Auth0
      # bearer token (validated below) must not reach kiwi, a public demo
      # server with no business seeing it. forwardHeaders is opt-in per
      # MCPRouteBackendRef, so simply omitting it keeps this backend
      # credential-blind by default.
    - name: betterstack
      kind: Backend
      group: gateway.envoyproxy.io
      path: "/"
      # Same forwardHeaders omission as kiwi -- the client's Auth0 token
      # must not reach Better Stack either. securityPolicy.apiKey instead
      # injects Better Stack's own bearer token (confirmed via the live
      # MCPRoute CRD schema: header defaults to "Authorization" with a
      # "Bearer " prefix, exactly what Better Stack's MCP server requires)
      # from the ExternalSecret-populated Secret in externalsecret.yaml.
      securityPolicy:
        apiKey:
          secretRef:
            name: betterstack-mcp
    - name: kagent-tools
      kind: Backend
      group: gateway.envoyproxy.io
    # Linear rides the vault's proxy listener as its MCP endpoint: the vault
    # (network-trusted, kagent-tools precedent) injects the fresh upstream
    # bearer per request and keeps it refreshed; no credential ever reaches
    # the gateway. Connect flow: /oauth/linear/start via the elicitation
    # HTTPRoute.
    - name: linear
      kind: Backend
      group: gateway.envoyproxy.io
      # backendRefs[].path is the backend's MCP endpoint path (CRD-verified
      # default "/mcp"). The vault's proxy listener path-dispatches on the
      # first segment as the provider name, so "/linear" is what selects
      # Linear's credential + upstream. The Backend name (== tool prefix
      # `linear__*`) and this path segment intentionally agree.
      path: "/linear"
      # No forwardHeaders/securityPolicy.apiKey -- the client's Auth0 token
      # must not reach this backend either (same reasoning as
      # kiwi/betterstack/kagent-tools); the vault injects Linear's own
      # credential from its encrypted store.
  securityPolicy:
    # MCPRoute's own OAuth mechanism (MCP spec's RFC 8414/9728-based
    # discovery), not the SecurityPolicy.oidc block used for hubble/flux --
    # this validates a pre-obtained bearer token (via oauth2c, same as the
    # LLM gateway) rather than doing a browser redirect. Dynamic Client
    # Registration is supported by Auth0 and by this MCP mechanism for
    # generic clients with no pre-existing credentials, but isn't needed
    # here -- this uses a pre-registered client (auth0_client.ai_gateway_mcp
    # in auth0.tf), same pattern as the LLM gateway.
    oauth:
      issuer: "https://auth.willpxxr.com/"
      # Must match protectedResourceMetadata.resource and
      # auth0_resource_server.ai_mcp.identifier (auth0.tf) exactly -- this
      # was inconsistent with protectedResourceMetadata.resource below
      # (bare host here vs full /mcp path there), which is what caused
      # Auth0 to reject the resource parameter opencode correctly sent
      # ("Service not found: https://mcp.tailb40090.ts.net/mcp").
      audiences:
        - "https://mcp.internal.willpxxr.com/mcp"
      protectedResourceMetadata:
        resource: "https://mcp.internal.willpxxr.com/mcp"
        resourceName: "willpxxr AI Gateway MCP"
        scopesSupported:
          - "mcp:use"
      # No claimToHeaders -- nothing from the validated token gets forwarded
      # to backends via this mechanism either, consistent with the
      # forwardHeaders omission above. (Multi-user will need this on for
      # the linear backend: forwarding the caller's identity to the vault
      # proxy is how per-principal credential resolution would work --
      # deferred until multi-user matters; see WEP-0006 amendment.)
    authorization:
      defaultAction: Deny
      rules:
        - action: Allow
          source:
            jwt:
              scopes:
                - "mcp:use"
