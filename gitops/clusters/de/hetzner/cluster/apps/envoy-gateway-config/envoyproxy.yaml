---
apiVersion: gateway.envoyproxy.io/v1alpha1
kind: EnvoyProxy
metadata:
  name: envoy-gateway-config
  namespace: envoy-gateway-system
  # Replace, not ServerSideApply: this object was adopted from Flux and its
  # spec carries stale field-manager claims (kustomize-controller + an older
  # argocd-controller manager name) that SSA cannot delete -- partial removals
  # merge into an object that fails the CRD's "host or backendRefs" validation
  # (2026-09-03, tracing-block removal). Replace swaps the whole spec and the
  # EG controller re-applies its defaults on the next reconcile.
  annotations:
    argocd.argoproj.io/sync-options: Replace=true
spec:
  provider:
    type: Kubernetes
    kubernetes:
      envoyService:
        type: LoadBalancer
        loadBalancerClass: tailscale
        annotations:
          tailscale.com/hostname: "gateway"
          tailscale.com/proxy-group: "ingress"
          tailscale.com/tags: "tag:services"
      # 2 data-plane pods: the ingress path must survive a worker reboot cycle
      # (workers periodically reboot -- see WEP-0007).
      envoyDeployment:
        replicas: 2
  # Tracing to the otel-collector gateway is disabled while the observability
  # stack is down (apps/otel-collector-gateway/ disabled 2026-09-03 -- see
  # AGENTS.md; its ReferenceGrant went with it). Uncomment together with the
  # collector's re-enable.
  # telemetry:
  #   tracing:
  #     samplingRate: 10
  #     provider:
  #       type: OpenTelemetry
  #       backendRefs:
  #         - name: otel-collector-gateway
  #           namespace: otel-collector
  #           port: 4317
