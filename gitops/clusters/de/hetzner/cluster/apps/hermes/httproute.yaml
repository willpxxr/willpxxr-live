---
# Hermes dashboard exposure (WEP-0014): HTTPRoute + ExternalSecrets.
# The dashboard handles its own Auth0 OIDC flow directly (self-hosted OIDC
# provider, HERMES_DASHBOARD_OIDC_*), so no Envoy SecurityPolicy is needed
# -- one clean auth layer instead of Envoy OIDC + basic auth.
#
# The envoy-gateway-oidc Auth0 client is reused (its callback URLs already
# include hermes.internal.willpxxr.com from auth0.tf). The dashboard reads
# client-id/client-secret from the ExternalSecret and runs the authorization
# code flow itself.

# ExternalSecret for the shared envoy-gateway-oidc Auth0 client creds.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: envoy-gateway-oidc
  namespace: hermes
spec:
  refreshInterval: 6h
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword
  target:
    name: envoy-gateway-oidc
    creationPolicy: Owner
  data:
    - secretKey: client-id
      remoteRef:
        key: envoy-gateway-oidc/credentials/client_id
    - secretKey: client-secret
      remoteRef:
        key: envoy-gateway-oidc/credentials/client_secret
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: hermes
  namespace: hermes
spec:
  parentRefs:
    - name: gateway
      namespace: envoy-gateway-system
      sectionName: tls
  hostnames:
    - "hermes.internal.willpxxr.com"
  rules:
    - backendRefs:
        - name: hermes
          port: 9119
