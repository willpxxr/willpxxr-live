---
# Hermes dashboard exposure (WEP-0014): HTTPRoute + ExternalSecret.
# The dashboard handles its own Auth0 OIDC flow directly (self-hosted OIDC
# provider, HERMES_DASHBOARD_OIDC_*). The OIDC provider requires a public
# PKCE client (no client secret) -- auth0_client.hermes_dashboard is a native
# client, separate from the confidential envoy_gateway_oidc client used by
# the Envoy SecurityPolicy flows (hubble/argocd/tokens).

# ExternalSecret for the hermes-dashboard Auth0 public client ID.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: hermes-dashboard-oidc
  namespace: hermes
spec:
  refreshInterval: 6h
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword
  target:
    name: hermes-dashboard-oidc
    creationPolicy: Owner
  data:
    - secretKey: client-id
      remoteRef:
        key: hermes-dashboard/credentials/client_id
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: hermes
  namespace: hermes
spec:
  parentRefs:
    - name: gateway
      namespace: envoy-gateway-system
      sectionName: tls
  hostnames:
    - "hermes.internal.willpxxr.com"
  rules:
    - backendRefs:
        - name: hermes
          port: 9119
