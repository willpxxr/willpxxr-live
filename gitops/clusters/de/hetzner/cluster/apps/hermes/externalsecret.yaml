---
# Auth0 M2M client credentials + Discord bot token for Hermes (WEP-0014).
# The M2M creds are used by the provider plugin's create_client override
# to mint client_credentials tokens against Auth0. The Discord bot token
# is consumed by the messaging gateway (hermes gateway run).
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: hermes-m2m
  namespace: hermes
spec:
  refreshInterval: 6h
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword
  target:
    name: hermes-m2m
    creationPolicy: Owner
  data:
    - secretKey: HERMES_AUTH0_CLIENT_ID
      remoteRef:
        key: hermes-m2m/credentials/client_id
    - secretKey: HERMES_AUTH0_CLIENT_SECRET
      remoteRef:
        key: hermes-m2m/credentials/client_secret
---
# Discord bot token (hermes-discord 1Password item, created by Terraform
# with a placeholder -- pasted by hand in 1Password afterwards, same
# pattern as the Synthetic API key).
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: hermes-discord
  namespace: hermes
spec:
  refreshInterval: 6h
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword
  target:
    name: hermes-discord
    creationPolicy: Owner
  data:
    - secretKey: DISCORD_BOT_TOKEN
      remoteRef:
        key: hermes-discord/credentials/bot_token
