---
# Auth0 M2M client credentials for the Hermes provider plugin's
# create_client override (WEP-0014). The plugin mints client_credentials
# tokens against Auth0 and injects them as Bearer headers on requests to
# the AI gateway (ai.internal.willpxxr.com).
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: hermes-m2m
  namespace: hermes
spec:
  refreshInterval: 6h
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword
  target:
    name: hermes-m2m
    creationPolicy: Owner
  data:
    - secretKey: HERMES_AUTH0_CLIENT_ID
      remoteRef:
        key: hermes-m2m/credentials/client_id
    - secretKey: HERMES_AUTH0_CLIENT_SECRET
      remoteRef:
        key: hermes-m2m/credentials/client_secret
