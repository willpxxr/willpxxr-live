---
# Telegram bot token + allowed-user allowlist for the AgentHarness telegram
# channel, from the placeholder item created in hermes.tf
# (onepassword_item.hermes_telegram_bot). Both fields must be filled in
# 1Password by hand before the harness becomes usable (see the harness
# comment in agentharness.yaml).
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: hermes-telegram-bot
  namespace: kagent-system
spec:
  # 6h: 1Password service-account rate limits are tight; secrets are
  # stable and rotations are git-driven (force-sync for on-demand).
  refreshInterval: 6h
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword
  target:
    name: hermes-telegram-bot
    creationPolicy: Owner
  data:
    - secretKey: token
      remoteRef:
        key: hermes-telegram-bot/credentials/token
    - secretKey: allowed-user-ids
      remoteRef:
        key: hermes-telegram-bot/credentials/allowed_user_ids
