---
apiVersion: "cilium.io/v2"
kind: CiliumNetworkPolicy
metadata:
  name: allow-same-namespace
  namespace: hermes
spec:
  description: "Hermes is a single-pod workload; same-namespace traffic is its own probes."
  endpointSelector: {}
  ingress:
    - fromEndpoints:
        - matchLabels:
            io.kubernetes.pod.namespace: hermes
  egress:
    - toEndpoints:
        - matchLabels:
            io.kubernetes.pod.namespace: hermes
---
apiVersion: "cilium.io/v2"
kind: CiliumNetworkPolicy
metadata:
  name: allow-dns-egress
  namespace: hermes
spec:
  description: "DNS resolution via CoreDNS for ai.internal.willpxxr.com, auth.willpxxr.com, and Discord endpoints."
  endpointSelector: {}
  egress:
    - toEndpoints:
        - matchLabels:
            k8s-app: kube-dns
            io.kubernetes.pod.namespace: kube-system
      toPorts:
        - ports:
            - port: "53"
              protocol: UDP
            - port: "53"
              protocol: TCP
---
apiVersion: "cilium.io/v2"
kind: CiliumNetworkPolicy
metadata:
  name: allow-ai-gateway-egress
  namespace: hermes
spec:
  description: "Hermes calls the in-cluster AI gateway (ai.internal.willpxxr.com) for LLM inference. Split-brain DNS (apps/kube-system/coredns-configmap.yaml) rewrites the hostname to the Envoy data-plane Service in envoy-gateway-system, so this allows egress to those pods on 10443 -- see WEP-0014."
  endpointSelector: {}
  egress:
    - toEndpoints:
        - matchLabels:
            app.kubernetes.io/name: envoy
            io.kubernetes.pod.namespace: envoy-gateway-system
      toPorts:
        - ports:
            - port: "10443"
              protocol: TCP
---
apiVersion: "cilium.io/v2"
kind: CiliumNetworkPolicy
metadata:
  name: allow-auth0-egress
  namespace: hermes
spec:
  description: "Hermes mints and refreshes Auth0 M2M tokens (client_credentials grant) at auth.willpxr.com for the AI gateway's JWT SecurityPolicy. Auth0 is Cloudflare-fronted so IPs aren't enumerable."
  endpointSelector: {}
  egress:
    - toEntities:
        - world
      toPorts:
        - ports:
            - port: "443"
              protocol: TCP
---
apiVersion: "cilium.io/v2"
kind: CiliumNetworkPolicy
metadata:
  name: allow-discord-egress
  namespace: hermes
spec:
  description: "Hermes messaging gateway connects to Discord via WebSocket (gateway.discord.gg) and REST (discord.com). Discord's IPs aren't enumerable."
  endpointSelector: {}
  egress:
    - toEntities:
        - world
      toPorts:
        - ports:
            - port: "443"
              protocol: TCP
