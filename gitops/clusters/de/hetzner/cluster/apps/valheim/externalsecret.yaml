---
# Valheim server password (WEP-0015). The 1Password item is created by
# Terraform (terraform/valheim.tf) with a placeholder -- pasted by hand
# in 1Password afterwards, same pattern as the Synthetic API key.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: valheim
  namespace: valheim
spec:
  refreshInterval: 6h
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword
  target:
    name: valheim
    creationPolicy: Owner
  data:
    - secretKey: SERVER_PASS
      remoteRef:
        key: valheim/credentials/password
