---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: valheim
  namespace: valheim
spec:
  serviceName: valheim
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: valheim
  template:
    metadata:
      labels:
        app.kubernetes.io/name: valheim
    spec:
      nodeSelector:
        node.kubernetes.io/instance-type: cx33
      terminationGracePeriodSeconds: 120
      securityContext:
        runAsUser: 0
        runAsGroup: 0
        fsGroup: 0
      containers:
        - name: valheim
          image: ghcr.io/community-valheim-tools/valheim-server:v1.2.0
          env:
            - name: SERVER_NAME
              value: "willpxxr"
            - name: WORLD_NAME
              value: "willpxxr"
            - name: SERVER_PASS
              valueFrom:
                secretKeyRef:
                  name: valheim
                  key: SERVER_PASS
            - name: SERVER_PUBLIC
              value: "false"
            - name: CROSSPLAY
              value: "true"
            - name: TZ
              value: "Europe/London"
            - name: STATUS_HTTP
              value: "true"
            - name: STATUS_HTTP_PORT
              value: "80"
          ports:
            - name: game
              containerPort: 2456
              protocol: UDP
            - name: query
              containerPort: 2457
              protocol: UDP
            - name: crossplay
              containerPort: 2458
              protocol: UDP
          resources:
            requests:
              cpu: "3"
              memory: 5Gi
            limits:
              cpu: "4"
              memory: 6Gi
          securityContext:
            capabilities:
              add:
                - SYS_NICE
          readinessProbe:
            httpGet:
              path: /status.json
              port: 80
            initialDelaySeconds: 60
            periodSeconds: 10
            failureThreshold: 30
          volumeMounts:
            - name: config
              mountPath: /config
            - name: config
              mountPath: /opt/valheim
              subPath: server
  volumeClaimTemplates:
    - metadata:
        name: config
      spec:
        accessModes:
          - ReadWriteOnce
        storageClassName: hcloud-volumes
        resources:
          requests:
            storage: 10Gi
