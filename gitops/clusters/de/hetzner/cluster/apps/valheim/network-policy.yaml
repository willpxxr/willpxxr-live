---
apiVersion: "cilium.io/v2"
kind: CiliumNetworkPolicy
metadata:
  name: allow-same-namespace
  namespace: valheim
spec:
  description: "Valheim is a single-pod workload; same-namespace traffic is its own probes."
  endpointSelector: {}
  ingress:
    - fromEndpoints:
        - matchLabels:
            io.kubernetes.pod.namespace: valheim
  egress:
    - toEndpoints:
        - matchLabels:
            io.kubernetes.pod.namespace: valheim
---
apiVersion: "cilium.io/v2"
kind: CiliumNetworkPolicy
metadata:
  name: allow-dns-egress
  namespace: valheim
spec:
  description: "DNS resolution via CoreDNS for Steam API endpoints."
  endpointSelector: {}
  egress:
    - toEndpoints:
        - matchLabels:
            k8s-app: kube-dns
            io.kubernetes.pod.namespace: kube-system
      toPorts:
        - ports:
            - port: "53"
              protocol: UDP
            - port: "53"
              protocol: TCP
---
apiVersion: "cilium.io/v2"
kind: CiliumNetworkPolicy
metadata:
  name: allow-valheim-ingress
  namespace: valheim
spec:
  description: "Public UDP ingress for Valheim game (32456), Steam query (32457), and crossplay backend (32458) via NodePort. First public ingress workload in the cluster (WEP-0015)."
  endpointSelector: {}
  ingress:
    - fromEntities:
        - world
      toPorts:
        - ports:
            - port: "32456"
              protocol: UDP
            - port: "32457"
              protocol: UDP
            - port: "32458"
              protocol: UDP
---
apiVersion: "cilium.io/v2"
kind: CiliumNetworkPolicy
metadata:
  name: allow-steam-egress
  namespace: valheim
spec:
  description: "Valheim server communicates with Steam (content download, master servers) and PlayFab (crossplay relay). Steam/PlayFab use many ports and IPs that aren't enumerable (CDN + Azure relay servers with unpredictable UDP ports). Egress to world on TCP 80/443 and all UDP."
  endpointSelector: {}
  egress:
    - toEntities:
        - world
      toPorts:
        - ports:
            - port: "80"
              protocol: TCP
            - port: "443"
              protocol: TCP
            - port: "3075"
              protocol: UDP
            - port: "27000"
              endPort: 27030
              protocol: UDP
    - toEntities:
        - world
      toPorts:
        - ports:
            - port: "1024"
              endPort: 65535
              protocol: UDP
