---
# Public NodePort Service for Valheim (WEP-0015). type: NodePort avoids the
# hcloud LoadBalancer cost (~€9/mo). externalTrafficPolicy: Local preserves
# client source IPs (no SNAT) and ensures ExternalDNS only publishes the IP of
# the node running the pod (not all nodes). SERVER_PORT=32456 in the StatefulSet
# means the container and node ports match -- important for crossplay, since
# PlayFab advertises the port the server reports and players must reach it
# directly. The hcloud firewall (managed via the module's extra_firewall_rules
# in terraform/hetzner.tf) opens UDP 32456-32458 on all nodes.
# ExternalDNS creates valheim.willpxxr.com from the hostname annotation.
apiVersion: v1
kind: Service
metadata:
  name: valheim
  namespace: valheim
  annotations:
    external-dns.alpha.kubernetes.io/hostname: valheim.willpxxr.com
spec:
  type: NodePort
  externalTrafficPolicy: Local
  selector:
    app.kubernetes.io/name: valheim
  ports:
    - name: game
      port: 32456
      targetPort: game
      nodePort: 32456
      protocol: UDP
    - name: query
      port: 32457
      targetPort: query
      nodePort: 32457
      protocol: UDP
    - name: crossplay
      port: 32458
      targetPort: crossplay
      nodePort: 32458
      protocol: UDP
