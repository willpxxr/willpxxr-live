---
# Same 1Password item as the AI gateway's LLM backends (synthetic.tf) -- the
# Synthetic API key is shared with the hermes harness's ModelConfig rather
# than minted separately (Synthetic is flat-rate; see WEP-0005).
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: synthetic
  namespace: kagent-system
spec:
  # 6h: 1Password service-account rate limits are tight; secrets are
  # stable and rotations are git-driven (force-sync for on-demand).
  refreshInterval: 6h
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword
  target:
    name: synthetic
    creationPolicy: Owner
  data:
    - secretKey: api-key
      remoteRef:
        key: synthetic/credentials/api_key
