# kagent chart values (chart: oci://ghcr.io/kagent-dev/kagent/helm/kagent 0.9.12).
#
# Minimal install: the built-in demo agents, the bundled MCP tools server and
# the demo PostgreSQL are all off -- this cluster wants the controller + UI +
# substrate worker pool, with agents (the hermes harness) declared in git.
database:
  postgres:
    # The controller refuses to start without a database (chart validation:
    # "No database connection configured"), so the bundled instance stays on.
    # It's chart-flagged dev/eval-only (hardcoded in-namespace credentials),
    # which matches substrate's own alpha status for this stack; a proper
    # external PostgreSQL (e.g. CNPG) is future work if kagent's memory
    # features get adopted. PVC lands on hcloud-volumes (10 GB floor).
    bundled:
      enabled: true
      storage: 1Gi

providers:
  # Default ModelConfig generated by the chart. The AgentHarness (apps/hermes)
  # references the explicit `synthetic` ModelConfig (modelconfig-synthetic.yaml)
  # instead, but the default is pointed at the same credentials so nothing
  # dangles: provider OpenAI-shape against Synthetic's OpenAI-compatible API
  # (confirmed serving syn:*/hf:* model ids -- see apps/ai-gateway-llm).
  default: openAI
  openAI:
    provider: OpenAI
    model: hf:zai-org/GLM-5.3-Flash
    apiKeySecretRef: synthetic
    apiKeySecretKey: api-key

controller:
  substrate:
    # Agent Substrate integration -- AgentHarness resources provision onto it.
    enabled: true
    ateApiEndpoint: dns:///api.ate-system.svc:443
    # ateapi uses the pod-certificate-issued serving cert; there is no public
    # CA to verify against from here, so trust it directly (same as the
    # upstream install guide).
    ateApiInsecure: true
    defaultWorkerPool:
      name: kagent-default

# Platform capacity owned by the kagent chart (not by individual harnesses).
# A long-lived AgentHarness pins its worker slot once its actor is created
# (upstream docs: replicas = 1 + number of active harnesses) -- one harness,
# so two workers.
substrateWorkerPool:
  create: true
  name: kagent-default
  replicas: 2
  # Required by the chart when create=true; pinned to the ateom build matching
  # the substrate chart version (0.0.21).
  ateomImage: ghcr.io/kagent-dev/substrate/ateom-gvisor:v0.0.21

# Already deployed standalone as its own app behind the MCP gateway
# (apps/kagent-tools, WEP-0002) -- do not run a second copy here.
kagent-tools:
  enabled: false

# Built-in demo agents and bundled extras -- not wanted (the agents would
# only exercise the default ModelConfig; the MCP extras duplicate capabilities
# already behind the ai-gateway-mcp MCPRoute).
k8s-agent:
  enabled: false
kgateway-agent:
  enabled: false
istio-agent:
  enabled: false
promql-agent:
  enabled: false
observability-agent:
  enabled: false
argo-rollouts-agent:
  enabled: false
helm-agent:
  enabled: false
cilium-policy-agent:
  enabled: false
cilium-manager-agent:
  enabled: false
cilium-debug-agent:
  enabled: false
grafana-mcp:
  enabled: false
querydoc:
  enabled: false
