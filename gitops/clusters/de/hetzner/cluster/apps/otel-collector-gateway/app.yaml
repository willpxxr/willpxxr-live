# ArgoCD app definition (see argocd/apps-applicationset.yaml + WEP-0001).
# helm-only apart from the ReferenceGrant: namespace/network-policy live in
# the otel-collector manifest app.
name: otel-collector-gateway
namespace: otel-collector
dir: apps/otel-collector-gateway  # cluster-relative app dir (appset prefixes the cluster path; used for
                  # the dir source + $app valueFiles)
helm:
  - repoURL: https://open-telemetry.github.io/opentelemetry-helm-charts
    chart: opentelemetry-collector
    version: ""
    releaseName: otel-collector-otel-collector-gateway
    values: values.yaml
manifests:
  - referencegrant.yaml
