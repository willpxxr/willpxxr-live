---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: mcp-token-vault
  namespace: mcp-token-vault
  labels:
    app.kubernetes.io/name: mcp-token-vault
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: mcp-token-vault
  template:
    metadata:
      labels:
        app.kubernetes.io/name: mcp-token-vault
    spec:
      containers:
        - name: vault
          # Rolling tag: CI (mcp-token-vault workflow) rebuilds :main on every
          # push touching services/mcp-token-vault. Pin to a sha- tag if a
          # change ever needs to be held back.
          image: ghcr.io/willpxxr/mcp-token-vault:main
          imagePullPolicy: Always
          ports:
            - name: proxy-linear
              containerPort: 8081
            - name: admin
              containerPort: 9090
            - name: oauth
              containerPort: 9091
          env:
            - name: RUST_LOG
              value: info
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: mcp-token-vault
                  key: db_url
            - name: VAULT_ENCRYPTION_KEY
              valueFrom:
                secretKeyRef:
                  name: mcp-token-vault
                  key: encryption_key
            - name: ADMIN_PORT
              value: "9090"
            - name: OAUTH_PORT
              value: "9091"
            # Public hostname the Gateway serves; the /oauth HTTPRoute (phase
            # 2) must make ELICITATION_BASE_URL + path reachable from a
            # browser for the elicitation UX to work.
            - name: ELICITATION_BASE_URL
              value: https://mcp.internal.willpxxr.com
            - name: PROVIDER_LINEAR_LISTEN_PORT
              value: "8081"
            - name: PROVIDER_LINEAR_UPSTREAM_URL
              value: https://mcp.linear.app/mcp
            # TO VERIFY when creating the Linear OAuth app: confirm the
            # authorize/token endpoints against Linear's OAuth docs (fetched
            # page was JS-rendered; values below are the commonly documented
            # ones).
            - name: PROVIDER_LINEAR_TOKEN_URL
              value: https://api.linear.app/oauth/token
            - name: PROVIDER_LINEAR_AUTHORIZE_URL
              value: https://linear.app/oauth/authorize
            - name: PROVIDER_LINEAR_REDIRECT_URI
              value: https://mcp.internal.willpxxr.com/oauth/linear/callback
            - name: PROVIDER_LINEAR_CLIENT_ID
              valueFrom:
                secretKeyRef:
                  name: linear-mcp-oauth
                  key: client_id
            - name: PROVIDER_LINEAR_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: linear-mcp-oauth
                  key: client_secret
          livenessProbe:
            httpGet:
              path: /healthz
              port: 9090
            initialDelaySeconds: 5
            periodSeconds: 30
          readinessProbe:
            httpGet:
              path: /healthz
              port: 9090
            initialDelaySeconds: 3
            periodSeconds: 10
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
          securityContext:
            runAsNonRoot: true
            readOnlyRootFilesystem: true
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            seccompProfile:
              type: RuntimeDefault
