---
# Linear OAuth client for the elicitation flow (WEP-0006 phase 2). The item
# ships with placeholder values and fails closed: refresh/exchange attempts
# fail until the real client_id/client_secret are pasted after creating the
# Linear OAuth application (redirect URI:
# https://mcp.internal.willpxxr.com/oauth/linear/callback).
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: linear-mcp-oauth
  namespace: mcp-token-vault
spec:
  refreshInterval: 6h
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword
  target:
    name: linear-mcp-oauth
    creationPolicy: Owner
  data:
    - secretKey: client_id
      remoteRef:
        key: linear-mcp-oauth/credentials/client_id
    - secretKey: client_secret
      remoteRef:
        key: linear-mcp-oauth/credentials/client_secret
