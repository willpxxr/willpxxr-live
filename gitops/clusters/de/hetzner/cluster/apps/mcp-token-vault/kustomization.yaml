# Rendered by ArgoCD's kustomize source (see app.yaml): a plain wrapper so
# ArgoCD treats this dir as kustomize. The image pin comes from the
# Application's kustomize.images override (envsubsted from
# $ARGOCD_APP_REVISION at render time) -- the base tag below is always
# overridden and exists only so the manifest is valid standalone.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - deployment.yaml
