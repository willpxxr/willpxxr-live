---
# Vault's own secrets: Supabase connection string + token-encryption master
# key (WEP-0006 decisions 2-3). Both items must exist in the 1Password
# `kubernetes` vault before this sync succeeds -- the pod fails closed
# (CrashLoop) until Phase 0 is done.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: mcp-token-vault
  namespace: mcp-token-vault
spec:
  # 6h: 1Password service-account rate limits are tight; rotations are
  # git/1Password-driven (force-sync annotation for on-demand).
  refreshInterval: 6h
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword
  target:
    name: mcp-token-vault
    creationPolicy: Owner
  data:
    - secretKey: db_url
      remoteRef:
        key: mcp-token-vault/credentials/db_url
    - secretKey: encryption_key
      remoteRef:
        key: mcp-token-vault/credentials/encryption_key
    # Built-in postgres role connection; consumed only by the bootstrap
    # CronJob, which reconciles the least-privilege role against db_url.
    - secretKey: admin_url
      remoteRef:
        key: mcp-token-vault/credentials/admin_url
