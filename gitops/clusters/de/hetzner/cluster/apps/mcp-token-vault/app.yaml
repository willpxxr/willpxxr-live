# ArgoCD app definition (see argocd/apps-applicationset.yaml + WEP-0001).
# Manifest + kustomize app: the mcp-token-vault service (WEP-0006) --
# credential vault + per-provider MCP proxy for ai-gateway-mcp. Source
# lives in services/mcp-token-vault in this repo; CI (.github/workflows/)
# builds and pushes the image.
#
# The Deployment is rendered through the kustomize source (kustomization.yaml)
# so the APPLICATIONSET can pin the image tag per commit: newTag is templated
# from the git generator's .sha, so every commit renders an image reference to
# its own sha-<commit> image (CI builds one for every push to main) -- the
# manifest's image change IS the rollout. Plain YAML gets no build-env
# substitution and ArgoCD 3.x removed the jsonnet source type (CRD-verified
# against v3.5.2); the ApplicationSet template is the one render-time hook.
name: mcp-token-vault
namespace: mcp-token-vault
kustomize:
  - repoURL: https://github.com/willpxxr/willpxxr-live.git
    revision: main
    images:
      - name: ghcr.io/willpxxr/mcp-token-vault
        newTag: sha-{{ $.sha }}
manifests:
  - namespace.yaml
  - network-policy.yaml
  - externalsecret-vault.yaml
  - externalsecret-linear.yaml
  - externalsecret-oidc.yaml
  - service.yaml
  - httproute-ui.yaml
  - security-policy.yaml
