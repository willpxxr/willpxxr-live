# ArgoCD app definition (see argocd/apps-applicationset.yaml + WEP-0001).
# Manifest + kustomize app: the mcp-token-vault service (WEP-0006) --
# credential vault + per-provider MCP proxy for ai-gateway-mcp. Source
# lives in services/mcp-token-vault in this repo.
#
# Image lifecycle (kustomize, no CI git writes, no Helm): the image tag is
# envsubsted from the build environment at render time
# ($ARGOCD_APP_REVISION = the synced commit's full SHA), so the rendered
# image IS the rollout driver. CI builds :sha-<commit> for every push to
# main (no paths filter) so the rendered tag always resolves. The
# Deployment is owned by the kustomize source, NOT the manifests source
# (two sources writing one resource would fight).
name: mcp-token-vault
namespace: mcp-token-vault
kustomize:
  - repoURL: https://github.com/willpxxr/willpxxr-live.git
    revision: main
    images:
      - "ghcr.io/willpxxr/mcp-token-vault:sha-${ARGOCD_APP_REVISION}"
manifests:
  - namespace.yaml
  - network-policy.yaml
  - externalsecret-vault.yaml
  - externalsecret-linear.yaml
  - externalsecret-oidc.yaml
  - service.yaml
  - httproute-ui.yaml
  - security-policy.yaml
