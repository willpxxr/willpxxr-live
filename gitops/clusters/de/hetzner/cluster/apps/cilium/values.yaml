# Cilium helm values (ArgoCD-managed since 2026-09-04, WEP-0011; previously
# applied by the hcloud-talos module via kubectl_manifest resources).
# Migrated to match the live install exactly -- verify any change against the
# rendered cilium-config before merging (verify-infra-change skill §3).
operator:
  replicas: 1
# Exact refs of the running images (tag@digest, as cilium-cli installed them)
# so the ArgoCD adoption causes zero pod rollouts. Drop the override on the
# next deliberate version bump.
image:
  override: quay.io/cilium/cilium:v1.16.2@sha256:4386a8580d8d86934908eea022b0523f812e6a542f30a86a47edd8bed90d51ea
envoy:
  image:
    override: quay.io/cilium/cilium-envoy:v1.29.9-1726784081-a90146d13b4cd7d168d573396ccf2b3db5a3b047@sha256:9762041c3760de226a8b00cc12f27dacc28b7691ea926748f9b5c18862db503f
hubble:
  relay:
    image:
      override: quay.io/cilium/hubble-relay:v1.16.2@sha256:4b559907b378ac18af82541dafab430a857d94f1057f2598645624e6e7ea286c
  ui:
    image:
      override: quay.io/cilium/hubble-ui:v0.13.1@sha256:e2e9313eb7caf64b0061d9da0efbdad59c6c461f6ca1752768942bfeda0796c6
ipam:
  mode: kubernetes
routingMode: native
ipv4NativeRoutingCIDR: 10.0.16.0/20
kubeProxyReplacement: true
# socketLB must not apply inside pod namespaces: Cilium's cgroup-level socket
# interception makes pod->ClusterIP traffic bypass the netfilter DNAT hooks the
# Tailscale operator's proxy pods rely on for L3 Service forwarding, which
# silently blackholes tailnet traffic to Tailscale LoadBalancer Services.
# Note kubeProxyReplacement=true force-enables socketLB regardless of
# .enabled (cilium/cilium#47417) -- hostNamespaceOnly is the load-bearing knob.
# Ref: https://tailscale.com/docs/kubernetes-operator/reference/compatibility#cilium-kube-proxy-replacement-mode
socketLB:
  enabled: true
  hostNamespaceOnly: true
bpf:
  masquerade: false
# Matches the live install ('disabled' in bpf-lb-acceleration). The talos
# module's current code would render 'best-effort' (XDP accel, with a
# fallthrough for tailscale's non-XDP path) -- flipping that is a deliberate
# follow-up change, kept out of the zero-churn migration.
loadBalancer:
  acceleration: disabled
encryption:
  enabled: false
  type: wireguard
securityContext:
  capabilities:
    ciliumAgent: [CHOWN, KILL, NET_ADMIN, NET_RAW, IPC_LOCK, SYS_ADMIN, SYS_RESOURCE, DAC_OVERRIDE, FOWNER, SETGID, SETUID]
    cleanCiliumState: [NET_ADMIN, SYS_ADMIN, SYS_RESOURCE]
cgroup:
  autoMount:
    enabled: false
  hostRoot: /sys/fs/cgroup
k8sServiceHost: 127.0.0.1
k8sServicePort: 7445
hubble:
  enabled: true
  relay:
    enabled: true
  ui:
    enabled: true
  metrics:
    enabled:
      - drop
      - tcp
      - flow
      - port-distribution
      - icmp
      - http
