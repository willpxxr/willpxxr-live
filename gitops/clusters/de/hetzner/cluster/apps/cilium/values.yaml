# Cilium helm values (ArgoCD-managed since 2026-09-04, WEP-0011).
# upgradeCompatibility: the version this cluster FIRST ran, kept for
# datapath-preserving upgrade rendering (cilium upgrade guide). CRDs are
# managed by the cilium-operator itself at startup (createCRDs hook) -- the
# chart ships none and needs no manual CRD applies.
upgradeCompatibility: "1.16"
operator:
  replicas: 1
ipam:
  mode: kubernetes
routingMode: native
ipv4NativeRoutingCIDR: 10.0.16.0/20
kubeProxyReplacement: true
# socketLB must not apply inside pod namespaces: Cilium's cgroup-level socket
# interception makes pod->ClusterIP traffic bypass the netfilter DNAT hooks the
# Tailscale operator's proxy pods rely on for L3 Service forwarding, which
# silently blackholes tailnet traffic to Tailscale LoadBalancer Services.
# Note kubeProxyReplacement=true force-enables socketLB regardless of
# .enabled (cilium/cilium#47417) -- hostNamespaceOnly is the load-bearing knob.
# Ref: https://tailscale.com/docs/kubernetes-operator/reference/compatibility#cilium-kube-proxy-replacement-mode
socketLB:
  enabled: true
  hostNamespaceOnly: true
bpf:
  masquerade: false
# Matches the live install ('disabled' in bpf-lb-acceleration). The talos
# module's current code would render 'best-effort' (XDP accel, with a
# fallthrough for tailscale's non-XDP path) -- flipping that is a deliberate
# follow-up change, kept out of the zero-churn migration.
loadBalancer:
  acceleration: disabled
encryption:
  enabled: false
  type: wireguard
securityContext:
  capabilities:
    ciliumAgent: [CHOWN, KILL, NET_ADMIN, NET_RAW, IPC_LOCK, SYS_ADMIN, SYS_RESOURCE, DAC_OVERRIDE, FOWNER, SETGID, SETUID]
    cleanCiliumState: [NET_ADMIN, SYS_ADMIN, SYS_RESOURCE]
cgroup:
  autoMount:
    enabled: false
  hostRoot: /sys/fs/cgroup
k8sServiceHost: 127.0.0.1
k8sServicePort: 7445
hubble:
  enabled: true
  relay:
    enabled: true
  ui:
    enabled: true
  metrics:
    enabled:
      - drop
      - tcp
      - flow
      - port-distribution
      - icmp
      - http
