# ArgoCD app definition (see argocd/apps-applicationset.yaml + WEP-0001).
# The namespace itself is Terraform-owned (bootstrap ordering for ESO, see
# tailscale.tf) -- hence no namespace.yaml here.
name: external-secrets
namespace: external-secrets
dir: apps/external-secrets  # cluster-relative app dir (appset prefixes the cluster path; used for
                  # the dir source + $app valueFiles)
helm:
  - repoURL: https://charts.external-secrets.io
    chart: external-secrets
    version: ""
    releaseName: external-secrets-external-secrets
    values: values.yaml
manifests:
  - network-policy.yaml
