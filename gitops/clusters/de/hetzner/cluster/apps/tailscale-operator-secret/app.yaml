# ArgoCD app definition (see argocd/apps-applicationset.yaml + WEP-0001).
# Manifest-only: the ExternalSecret backing the Tailscale operator's OAuth
# credentials (item written by tailscale.tf).
name: tailscale-operator-secret
namespace: tailscale
dir: apps/tailscale-operator-secret  # cluster-relative app dir (appset prefixes the cluster path; used for
                  # the dir source + $app valueFiles)
manifests:
  - secret.yaml
