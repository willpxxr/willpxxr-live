---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: operator-oauth
  namespace: tailscale
spec:
  # 6h: 1Password service-account rate limits are tight; secrets are
  # stable and rotations are git-driven (force-sync for on-demand).
  refreshInterval: 6h
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword
  target:
    name: operator-oauth
    creationPolicy: Owner
  data:
    - secretKey: client_id
      remoteRef:
        key: tailscale-operator-oauth/credentials/client_id
    - secretKey: client_secret
      remoteRef:
        key: tailscale-operator-oauth/credentials/client_secret