---
apiVersion: batch/v1
kind: Job
metadata:
  name: gvisor-smoke
  namespace: substrate
spec:
  # Phase-0 gate item (WEP-0016): proves a pod pins runtimeClassName:
  # gvisor and executes under runsc -- `uname -a` in the logs must report
  # the gVisor kernel. Removed from the app once green is recorded.
  backoffLimit: 0
  template:
    spec:
      runtimeClassName: gvisor
      restartPolicy: Never
      containers:
        - name: smoke
          image: docker.io/library/alpine:3.22
          command:
            - /bin/sh
            - -c
            - uname -a
