# The Supabase reconcile SQL, carried as a ConfigMap so the Job's command
# is a plain `psql -f` invocation (no shell heredocs: a heredoc inside
# args is one YAML-indent mangle away from a forever-stdin-reading pod --
# the first bootstrap run hung for exactly that class of reason).
# Passwords never appear here: psql injects them from the Secret's env
# via -v plus :'var' quoting (\gexec-guarded CREATEs are idempotent; the
# ALTERs re-assert the same TF-generated passwords on re-runs).
#
# A PRESYNC hook at wave -1: the schema-migrate Job (wave 0 in the same
# phase) reads this ConfigMap at container start, so it must exist before
# the Job's pod can start -- as a main-phase resource it only applied
# after PreSync, which deadlocks the hook (the live proof: the first
# hook run stuck in CreateContainerConfigError, configmap not found,
# 2026-10-31). BeforeHookCreation deletes+recreates it each sync just
# ahead of the Job; it persists between syncs.
apiVersion: v1
kind: ConfigMap
metadata:
  name: substrate-bootstrap-sql
  namespace: substrate
  annotations:
    argocd.argoproj.io/hook: PreSync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation
    argocd.argoproj.io/sync-wave: "-1"
data:
  bootstrap.sql: |
    SELECT format('CREATE ROLE substrate_owner LOGIN PASSWORD %L', :'owner_pw')
    WHERE NOT EXISTS (SELECT FROM pg_roles WHERE rolname = 'substrate_owner')\gexec
    SELECT format('CREATE ROLE substrate_readwrite LOGIN PASSWORD %L', :'rw_pw')
    WHERE NOT EXISTS (SELECT FROM pg_roles WHERE rolname = 'substrate_readwrite')\gexec
    ALTER ROLE substrate_owner LOGIN PASSWORD :'owner_pw';
    ALTER ROLE substrate_readwrite LOGIN PASSWORD :'rw_pw';
    -- Supabase: the session role (postgres) is not a member of roles it
    -- creates and cannot SET ROLE to them, which CREATE SCHEMA ...
    -- AUTHORIZATION requires (verified live 2026-10-31). The grants are
    -- idempotent.
    GRANT substrate_owner TO postgres;
    GRANT substrate_readwrite TO postgres;
    CREATE SCHEMA IF NOT EXISTS substrate AUTHORIZATION substrate_owner;
    ALTER ROLE substrate_owner SET search_path TO substrate, public;
    ALTER ROLE substrate_readwrite SET search_path TO substrate, public;
    GRANT USAGE, CREATE ON SCHEMA substrate TO substrate_readwrite;
    ALTER DEFAULT PRIVILEGES FOR ROLE substrate_owner IN SCHEMA substrate
      GRANT SELECT, INSERT, UPDATE, DELETE ON TABLES TO substrate_readwrite;
    ALTER DEFAULT PRIVILEGES FOR ROLE substrate_owner IN SCHEMA substrate
      GRANT USAGE, SELECT ON SEQUENCES TO substrate_readwrite;
