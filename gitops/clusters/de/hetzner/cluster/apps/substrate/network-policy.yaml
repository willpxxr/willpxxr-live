---
apiVersion: "cilium.io/v2"
kind: CiliumNetworkPolicy
metadata:
  name: allow-same-namespace
  namespace: substrate
spec:
  description: "Default-deny posture; same-namespace traffic only."
  endpointSelector: {}
  ingress:
    - fromEndpoints:
        - matchLabels:
            io.kubernetes.pod.namespace: substrate
  egress:
    - toEndpoints:
        - matchLabels:
            io.kubernetes.pod.namespace: substrate
---
apiVersion: "cilium.io/v2"
kind: CiliumNetworkPolicy
metadata:
  name: allow-dns-egress
  namespace: substrate
spec:
  description: "DNS resolution via CoreDNS (image pulls need name resolution during the smoke; Phase-1 substrate adds its own egress rules)."
  endpointSelector: {}
  egress:
    - toEndpoints:
        - matchLabels:
            k8s-app: kube-dns
            io.kubernetes.pod.namespace: kube-system
      toPorts:
        - ports:
            - port: "53"
              protocol: UDP
            - port: "53"
              protocol: TCP
