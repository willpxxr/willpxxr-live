# Substrate secrets via the 1Password/ESO pattern (AGENTS conventions;
# refreshInterval 6h, on-demand via the force-sync annotation).
# Items are TF writer-of-record: `substrate` (terraform/supabase.tf) and
# `substrate-s3` (terraform/objectstorage.tf); the vault item's admin_url
# is reused by the one-time bootstrap Job (WEP-0006's DB-admin credential,
# never duplicated anywhere else).
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: ate-api-server-secret-envvars
  namespace: substrate
  annotations:
    # Wave -1: secret-provisioning lands before everything that consumes
    # it (the bootstrap Job and the control plane read these Secrets at
    # container start). See the wave note on the Job below.
    argocd.argoproj.io/sync-wave: "-1"
spec:
  refreshInterval: 6h
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword
  target:
    name: ate-api-server-secret-envvars
    creationPolicy: Owner
    template:
      engineVersion: v2
      data:
        # Non-secret, but upstream ships it in the Secret half of the pair
        # (ate-setup apienv.go buildAPIServerEnvVars), so the template
        # carries the literal to keep the delivered key set identical.
        ATE_API_POSTGRES_SCHEMA: "substrate"
  data:
    - secretKey: ATE_API_POSTGRES_OWNER_CONNECTION_STRING
      remoteRef:
        key: substrate/credentials/owner_connection_string
    - secretKey: ATE_API_POSTGRES_READ_WRITE_CONNECTION_STRING
      remoteRef:
        key: substrate/credentials/readwrite_connection_string
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: substrate-s3
  namespace: substrate
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
spec:
  refreshInterval: 6h
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword
  target:
    name: substrate-s3
    creationPolicy: Owner
  data:
    - secretKey: access-key-id
      remoteRef:
        key: substrate-s3/credentials/access_key_id
    - secretKey: secret-access-key
      remoteRef:
        key: substrate-s3/credentials/secret_access_key
---
# Credentials for the one-time Supabase role/schema bootstrap Job only:
# the DB admin connection (the vault item's admin_url) plus the raw role
# passwords TF generated. Rotating the TF passwords requires deleting the
# completed bootstrap Job and letting ArgoCD re-run it.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: substrate-bootstrap
  namespace: substrate
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
spec:
  refreshInterval: 6h
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword
  target:
    name: substrate-bootstrap
    creationPolicy: Owner
  data:
    - secretKey: admin-url
      remoteRef:
        key: mcp-token-vault/credentials/admin_url
    - secretKey: owner-password
      remoteRef:
        key: substrate/credentials/owner_password
    - secretKey: readwrite-password
      remoteRef:
        key: substrate/credentials/readwrite_password
