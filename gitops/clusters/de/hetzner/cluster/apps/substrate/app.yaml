# WEP-0016: the Phase-0 gate artifacts landed 2026-10-25 and the smoke
# went green (one-shot Job pruned after verification) -- this directory
# now carries the fleet-wide gvisor RuntimeClass and grows into the
# Phase-1 substrate install app.
name: substrate
namespace: substrate
manifests:
  - namespace.yaml
  - network-policy.yaml
  - gvisor-runtimeclass.yaml
  # WEP-0016 Phase 1: the upstream v0.6.0 bundle, rendered by
  # scripts/render-substrate.sh (digest-pinned GHCR images, namespace
  # retarget, S3 sidecar env), plus the fleet's env contract: the
  # envvars ConfigMap half, the three ExternalSecrets (Secret half +
  # S3 keys + bootstrap credentials) and the Supabase store reconcile
  # pair: SQL ConfigMap (PreSync wave -1) + hook Job (wave 0). The dataplane trio (atenet-router,
  # -monitoring, -egress) renders into rendered/dataplane/ and stays
  # OUT of this list until the socket-LB worker-path probes pass --
  # the 2026-07/08 ClusterIP-blackholing precedent class.
  - rendered/core/*.yaml
  - ate-api-server-envvars.yaml
  - externalsecret.yaml
  - bootstrap-sql.yaml
  - bootstrap-job.yaml
