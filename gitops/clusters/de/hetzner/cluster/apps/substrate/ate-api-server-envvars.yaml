# The ConfigMap half of upstream's paired envvars contract (written by
# ate-setup's apienv step in a normal install; the Secret half is
# ate-api-server-secret-envvars, ESO-materialized from the `substrate`
# 1Password item in externalsecret.yaml). Env names match ateapi's @env
# table exactly (cmd/ateapi/main.go loadFlagsFromEnv, v0.6.0).
apiVersion: v1
kind: ConfigMap
metadata:
  name: ate-api-server-envvars
  namespace: substrate
data:
  ATE_API_POSTGRES_OWNER_ROLE: "substrate_owner"
  ATE_API_POSTGRES_READ_WRITE_ROLE: "substrate_readwrite"
  # The iss claim for actor JWTs. Must be https://<host>-shaped -- the
  # ate-idp-server validates its own --issuer that way and the two halves
  # are one value rendered twice (the idp mints iss, the api validates
  # against this env var). Lockstep with the --issuer injection in
  # scripts/render-substrate.sh. Phase 2's credential chain may refine it.
  ATE_API_ACTOR_JWT_ISSUER: "https://ate-idp.substrate.svc"
  # GCS-only setting (credential-exchange snapshot transfer SA); the S3
  # snapshot backend never reads it, but the key must exist for the
  # sidecar's configMapKeyRef.
  ATE_API_SNAPSHOT_TRANSFER_SERVICE_ACCOUNT: ""
  ATE_API_SNAPSHOT_LOCATION: "s3://willpxxr-live-substrate-snapshots/"
