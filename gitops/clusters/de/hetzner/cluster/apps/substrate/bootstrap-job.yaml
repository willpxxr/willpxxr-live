# Supabase store reconcile as an ArgoCD PRESYNC hook -- the canonical Argo
# pattern for schema migrations. The Job runs BEFORE the main sync waves
# apply the control plane, so ateapi's first boot already finds the roles,
# passwords and schema it needs (upstream runs migrations as
# substrate_owner at startup and cannot come up without them). generateName
# means every sync creates a fresh schema-migrate-XXXXX: Job template
# immutability can never collide with a sync again, and the previous hook
# instance is deleted BeforeHookCreation (ArgoCD's default hook policy), so
# exactly the last run stays inspectable between syncs. The SQL is
# idempotent (CREATE ROLE via \gexec, ALTER ROLE re-assert, GRANTs, CREATE
# SCHEMA IF NOT EXISTS), so every sync re-reconciles the store -- which is
# also the password-rotation path: a TF password change lands in 1Password,
# ESO refreshes the Secret, and the next sync re-runs the ALTER ROLEs. No
# manual Job deletion, ever.
#
# The admin connection (postgres role) comes from the same
# mcp-token-vault admin_url the vault's own reconciler uses -- the only
# existing holder of Supabase admin credentials; not duplicated anywhere.
# The SQL itself lives in the substrate-bootstrap-sql ConfigMap
# (bootstrap-sql.yaml), which runs as the wave -1 companion of this Job in
# the same PreSync phase; psql reads it via -f: no shell heredocs in
# container args. The Job's env Secret (externalsecret.yaml) is ESO-managed
# and refreshed out-of-band between syncs.
apiVersion: batch/v1
kind: Job
metadata:
  generateName: schema-migrate-
  namespace: substrate
  annotations:
    argocd.argoproj.io/hook: PreSync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation
    argocd.argoproj.io/sync-wave: "0"
spec:
  backoffLimit: 4
  template:
    metadata:
      labels:
        app: substrate-store-bootstrap
    spec:
      restartPolicy: Never
      containers:
        - name: psql
          # Upstream's own bundled-postgres pin (manifests/ate-install/
          # postgres/postgres.yaml), reused here so the fleet references
          # one postgres image. Digest re-verified against the registry
          # 2026-10-31 (the previous pin had two stray hex chars and the
          # apiserver refused it as InvalidImageName).
          image: postgres:18-alpine@sha256:10a5c69a83035ab5239f5620d708520e8b28f5aa1f2b20143e6024532edadfb5
          command: ["/bin/sh", "-ec"]
          args:
            - >-
              printf '%s\n' "$BOOTSTRAP_SQL" > /tmp/bootstrap.sql &&
              psql "$ADMIN_URL" -v ON_ERROR_STOP=1
              -v owner_pw="$OWNER_PASSWORD" -v rw_pw="$READWRITE_PASSWORD"
              -f /tmp/bootstrap.sql &&
              echo "substrate roles + schema reconciled."
          env:
            - name: ADMIN_URL
              valueFrom:
                secretKeyRef:
                  name: substrate-bootstrap
                  key: admin-url
            - name: OWNER_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: substrate-bootstrap
                  key: owner-password
            - name: READWRITE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: substrate-bootstrap
                  key: readwrite-password
            - name: BOOTSTRAP_SQL
              valueFrom:
                configMapKeyRef:
                  name: substrate-bootstrap-sql
                  key: bootstrap.sql
