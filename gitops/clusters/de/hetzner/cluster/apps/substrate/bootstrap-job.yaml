# One-time Supabase bootstrap: upstream's store surface expects the two
# roles (substrate_owner runs migrations, substrate_readwrite serves
# traffic) and their schema to already exist -- unlike mcp-token-vault,
# substrate does not self-bootstrap. The SQL lives in the
# substrate-bootstrap-sql ConfigMap (bootstrap-sql.yaml) and psql reads
# it via -f: no shell heredocs in container args (the first run's heredoc
# form survived a YAML-indent mangle only by luck; a ConfigMap + -f is
# structurally immune to that class). Rotating the TF passwords requires
# deleting the completed Job and letting ArgoCD recreate it.
#
# The admin connection (postgres role) comes from the same
# mcp-token-vault admin_url the vault's own reconciler uses -- the only
# existing holder of Supabase admin credentials; not duplicated anywhere.
# Wave shape: the three ExternalSecrets run at wave -1 so this Job's env
# Secrets exist before its pod starts (an earlier design put the Job
# itself at wave -1 before its own credentials could exist, deadlocking
# the sync wave gate).
apiVersion: batch/v1
kind: Job
metadata:
  name: substrate-store-bootstrap
  namespace: substrate
  annotations:
    # Job spec.template is immutable; Replace makes template changes
    # delete-and-recreate instead of failing the apply (the exact
    # "field is immutable" wall the 2026-10-31 01:22 sync hit).
    argocd.argoproj.io/sync-options: Replace=true
spec:
  backoffLimit: 4
  template:
    metadata:
      labels:
        app: substrate-store-bootstrap
    spec:
      restartPolicy: Never
      containers:
        - name: psql
          # Upstream's own bundled-postgres pin (manifests/ate-install/
          # postgres/postgres.yaml), reused here so the fleet references
          # one postgres image.
          image: postgres:18-alpine@sha256:9a8afca54e7861fd90fab5fdf4c42477a6b1cb7d293595148e674e0a3181dba1d
          command: ["/bin/sh", "-ec"]
          args:
            - >-
              printf '%s\n' "$BOOTSTRAP_SQL" > /tmp/bootstrap.sql &&
              psql "$ADMIN_URL" -v ON_ERROR_STOP=1
              -v owner_pw="$OWNER_PASSWORD" -v rw_pw="$READWRITE_PASSWORD"
              -f /tmp/bootstrap.sql &&
              echo "substrate roles + schema reconciled."
          env:
            - name: ADMIN_URL
              valueFrom:
                secretKeyRef:
                  name: substrate-bootstrap
                  key: admin-url
            - name: OWNER_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: substrate-bootstrap
                  key: owner-password
            - name: READWRITE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: substrate-bootstrap
                  key: readwrite-password
            - name: BOOTSTRAP_SQL
              valueFrom:
                configMapKeyRef:
                  name: substrate-bootstrap-sql
                  key: bootstrap.sql
