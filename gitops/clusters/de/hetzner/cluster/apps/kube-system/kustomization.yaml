# Explicit file index for the Flux build during the Flux->ArgoCD
# migration overlap (WEP-0001): keeps app.yaml out of the resource set.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - network-policy.yaml
  - hubble-oidc-externalsecret.yaml
  - hubble-route.yaml
  - hubble-security-policy.yaml
