# ArgoCD app definition (see argocd/apps-applicationset.yaml + WEP-0001).
# Manifest-only app: Hubble UI exposure bolted onto kube-system (the Cilium
# operator itself stays OVH-managed/unmanaged).
name: kube-system
namespace: kube-system
dir: apps/kube-system  # cluster-relative app dir (appset prefixes the cluster path; used for
                  # the dir source + $app valueFiles)
manifests:
  - network-policy.yaml
  - hubble-oidc-externalsecret.yaml
  - hubble-route.yaml
  - hubble-security-policy.yaml
