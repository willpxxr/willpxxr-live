# Explicit file index for the Flux build during the Flux->ArgoCD
# migration overlap (WEP-0001): keeps app.yaml/values.yaml out of the
# resource set while still syncing the HelmReleases.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - helmrelease.yaml
  - helmrepository.yaml
  - namespace.yaml
  - network-policy.yaml
  - rbac-cilium-exec.yaml
