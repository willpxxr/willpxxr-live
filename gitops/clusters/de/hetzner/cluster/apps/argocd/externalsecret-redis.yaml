---
# Redis auth for ArgoCD, repo-standard 1Password/ESO flow (the value is
# Terraform-generated -- argocd.tf -- because the chart's init Job deadlocks
# GitOps syncs; see apps/argocd/values.yaml). creationPolicy Owner: ESO fully
# owns the argocd-redis secret (its only key is `auth`).
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: argocd-redis
  namespace: argocd
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword
  refreshInterval: 6h
  target:
    name: argocd-redis
    creationPolicy: Owner
  data:
    - secretKey: auth
      remoteRef:
        key: argocd-redis/credentials/auth
