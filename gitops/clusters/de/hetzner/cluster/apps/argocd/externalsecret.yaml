---
# Same 1Password item as the hubble/flux routes (auth0.tf:
# onepassword_item.envoy_gateway_oidc) -- the shared envoy-gateway-oidc
# Auth0 client now also serves this route's OIDC flow.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: envoy-gateway-oidc
  namespace: argocd
spec:
  # 6h: 1Password service-account rate limits are tight; secrets are
  # stable and rotations are git-driven (force-sync for on-demand).
  refreshInterval: 6h
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword
  target:
    name: envoy-gateway-oidc
    creationPolicy: Owner
  data:
    - secretKey: client-id
      remoteRef:
        key: envoy-gateway-oidc/credentials/client_id
    - secretKey: client-secret
      remoteRef:
        key: envoy-gateway-oidc/credentials/client_secret
