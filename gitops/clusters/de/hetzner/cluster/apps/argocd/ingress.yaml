---
# Tailscale-side of the ArgoCD UI exposure: this Ingress is what creates the
# argocd.tailb40090.ts.net MagicDNS name (proxy-group "ingress"); traffic
# lands on the Envoy gateway service, where the HTTPRoute (argocd ns) and its
# Auth0 SecurityPolicy take over. Mirrors gateway/flux-operator-ingress.yaml.
# NOTE: lives in envoy-gateway-system like every other tailscale Ingress --
# Ingress backends resolve within the Ingress's own namespace, and the envoy
# gateway service is here (an Ingress in argocd ns would forward to a
# nonexistent service and the proxy 404s).
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: argocd
  namespace: envoy-gateway-system
  annotations:
    tailscale.com/proxy-group: "ingress"
    tailscale.com/tags: "tag:admin-services"
spec:
  ingressClassName: tailscale
  tls:
    - hosts:
        - argocd
  defaultBackend:
    service:
      name: envoy-envoy-gateway-system-gateway-4864c4ea
      port:
        number: 80
