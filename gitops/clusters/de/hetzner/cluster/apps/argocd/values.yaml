# TLS terminates at the Envoy Gateway (SecurityPolicy OIDC, see
# security-policy.yaml) -- argocd-server serves plain HTTP behind the route,
# same pattern as the flux-operator UI.
# dex is disabled: authentication is Envoy Gateway's SecurityPolicy (Auth0
# native OIDC), not ArgoCD's own SSO/Dex flow.
dex:
  enabled: false
# The one-shot redis auth secret was created by the one-time helm bootstrap;
# the init Job has no business inside a GitOps sync -- ArgoCD treats Jobs as
# sync hooks and the job waits on a rollout the same sync would apply
# (deadlock -> 10m timeout -> failed hook -> sync stuck). If the secret ever
# needs recreating: kubectl -n argocd create secret generic argocd-redis
# --from-literal=auth=$(openssl rand -hex 16), then roll redis.
redisSecretInit:
  enabled: false
configs:
  # OCI helm sources (envoy-gateway/ai-gateway from docker.io/envoyproxy,
  # kagent-tools from ghcr.io) require the repo registered with enableOCI
  # for repo-server to resolve chart revisions -- even for anonymous public
  # registries; without this, resolution 401s against registry-1.docker.io.
  # Classic https chart repos (jetstack, grafana, ...) work unregistered.
  repositories:
    # OCI repo registrations must be the registry ROOT (hostname only) --
    # deeper URLs fail ArgoCD's connectivity test ("OCI Helm repository URL
    # should include hostname and port only"). The chart path lives in each
    # Application's `chart` field instead (e.g. envoyproxy/gateway-helm).
    envoyproxy-oci:
      url: oci://docker.io
      name: envoyproxy-oci
      type: helm
      enableOCI: "true"
    ghcr-oci:
      url: oci://ghcr.io
      name: ghcr-oci
      type: helm
      enableOCI: "true"
  params:
    "server.insecure": true
  cm:
    # The Envoy Gateway SecurityPolicy is the real authentication boundary
    # (Auth0 OIDC in front of the HTTPRoute, same model as hubble/flux).
    # Behind that perimeter ArgoCD itself treats every visitor as the
    # default role below (read-only) -- git is the write path, not the UI.
    "users.anonymous.enabled": "true"
    # Resource tracking: the default label key (app.kubernetes.io/instance)
    # collides with helm charts' own instance labels (release names) --
    # syncs would overwrite them and break label selectors. Track via
    # annotation + a non-conflicting label key instead.
    "application.trackingMethod": "annotation"
    "application.instanceLabelKey": "argocd.argoproj.io/instance"
    # Controller-injected defaults: the Envoy Gateway / AI Gateway
    # controllers write default fields into their CRs' specs at reconcile
    # time (verified live by diffing live vs git) -- without these ignores
    # every one of those resources is permanently OutOfSync. Only fields
    # this repo never sets are ignored; anything we do set still diffs and
    # applies (ignoreDifferences affects comparison, not sync).
    "resource.customizations.ignoreDifferences.gateway.envoyproxy.io_EnvoyProxy": |
      jqPathExpressions:
        - .spec.telemetry.tracing.provider.port
        - .spec.telemetry.tracing.provider.backendRefs[]?.group
        - .spec.telemetry.tracing.provider.backendRefs[]?.kind
        - .spec.telemetry.tracing.provider.backendRefs[]?.weight
      jsonPointers:
        - /spec/logging
        - /spec/provider/kubernetes/envoyService/externalTrafficPolicy
    "resource.customizations.ignoreDifferences.gateway.envoyproxy.io_SecurityPolicy": |
      jqPathExpressions:
        - .spec.jwt.providers[].remoteJWKS.cacheDuration
    "resource.customizations.ignoreDifferences.gateway.networking.k8s.io_Gateway": |
      jqPathExpressions:
        - .spec.listeners[].tls?.certificateRefs[]?.group
        - .spec.listeners[].tls?.certificateRefs[]?.kind
    "resource.customizations.ignoreDifferences.gateway.networking.k8s.io_HTTPRoute": |
      jqPathExpressions:
        - .spec.parentRefs[].group
        - .spec.parentRefs[].kind
        - .spec.rules[].backendRefs[]?.group
        - .spec.rules[].backendRefs[]?.kind
        - .spec.rules[].backendRefs[]?.weight
        - .spec.rules[].matches[]?.path
    "resource.customizations.ignoreDifferences.aigateway.envoyproxy.io_AIGatewayRoute": |
      jqPathExpressions:
        - .spec.parentRefs[].group
        - .spec.parentRefs[].kind
        - .spec.rules[].modelsOwnedBy
        - .spec.rules[].backendRefs[].priority
        - .spec.rules[].backendRefs[]?.weight
        - .spec.rules[].matches[]?.headers[]?.type
    "resource.customizations.ignoreDifferences.aigateway.envoyproxy.io_MCPRoute": |
      jqPathExpressions:
        - .spec.parentRefs[].group
        - .spec.parentRefs[].kind
        - .spec.backendRefs[].securityPolicy.apiKey.secretRef.group
        - .spec.backendRefs[].securityPolicy.apiKey.secretRef.kind
  rbac:
    "policy.default": "role:readonly"
