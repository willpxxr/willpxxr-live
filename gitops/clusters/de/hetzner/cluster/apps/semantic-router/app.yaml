# ArgoCD app definition (see argocd/apps-applicationset.yaml + WEP-0001).
# vLLM Semantic Router (vSR) — the prompt-classification ext-proc service
# attached to the AI gateway's Gateway via EnvoyExtensionPolicy (WEP-0013).
# The helm chart is VENDORED at ./semantic-router/ (upstream v0.3.0, deps
# stripped) and consumed as a GIT-HOSTED helm chart: the appset's helm
# source uses `path` (the chart dir within this repo) — the `chart` field is
# helm-repository-only and 404s on git. First git-hosted-chart app (the
# appset's helm template grew the path variant for it).
name: semantic-router
namespace: vllm-semantic-router-system
helm:
  - repoURL: https://github.com/willpxxr/willpxxr-live.git
    path: gitops/clusters/de/hetzner/cluster/apps/semantic-router/semantic-router
    version: main
    releaseName: semantic-router
    values: values.yaml
