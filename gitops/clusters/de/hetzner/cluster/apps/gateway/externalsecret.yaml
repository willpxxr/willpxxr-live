---
# Cloudflare API token for the DNS-01 solver (same Terraform-created 1Password
# item as ExternalDNS -- see internaldns.tf + WEP-0003).
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: cloudflare-api-token
  namespace: envoy-gateway-system
spec:
  refreshInterval: 6h
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword
  target:
    name: cloudflare-api-token
    creationPolicy: Owner
  data:
    - secretKey: token
      remoteRef:
        key: internal-dns-cloudflare/credentials/token
