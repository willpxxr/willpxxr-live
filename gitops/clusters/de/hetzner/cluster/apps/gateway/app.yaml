# ArgoCD app definition (see argocd/apps-applicationset.yaml + WEP-0001).
# Manifest-only app: the Gateway, its TLS chain, and the Tailscale ingresses.
# flux-operator-ingress.yaml is included so ArgoCD prunes it in phase 4 when
# the Flux UI goes away (WEP-0001).
name: gateway
namespace: envoy-gateway-system
manifests:
  - gateway.yaml
  - gateway-ingress.yaml
  - hubble-ingress.yaml
  - certificate.yaml
  - issuer.yaml
