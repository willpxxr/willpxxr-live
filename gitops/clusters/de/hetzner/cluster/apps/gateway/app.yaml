# ArgoCD app definition (see argocd/apps-applicationset.yaml + WEP-0001).
# Manifest-only app: the Gateway and its TLS chain. Tailnet exposure is L3
# only now (the LoadBalancer Service); host routing + TLS live at Envoy
# (WEP-0003) -- the old per-hostname Tailscale L7 Ingresses are gone.
name: gateway
namespace: envoy-gateway-system
manifests:
  - gateway.yaml
  - certificate.yaml
  - issuer.yaml
  - externalsecret.yaml
