---
# Single wildcard for every tailnet-facing hostname (WEP-0003). Envoy
# terminates TLS for all *.internal.willpxxr.com routes with this cert.
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: gateway-tls
  namespace: envoy-gateway-system
spec:
  secretName: gateway-tls
  duration: 8760h
  renewBefore: 720h
  issuerRef:
    name: cloudflare-dns01
    kind: Issuer
  commonName: "internal.willpxxr.com"
  dnsNames:
    - "*.internal.willpxxr.com"
    - "internal.willpxxr.com"
