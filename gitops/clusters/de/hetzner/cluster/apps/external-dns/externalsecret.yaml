---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: external-dns-cloudflare
  namespace: external-dns
spec:
  # 6h: 1Password service-account rate limits are tight; secrets are
  # stable and rotations are git-driven (force-sync for on-demand).
  refreshInterval: 6h
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword
  target:
    name: external-dns-cloudflare
    creationPolicy: Owner
  data:
    - secretKey: token
      remoteRef:
        key: internal-dns-cloudflare/credentials/token
