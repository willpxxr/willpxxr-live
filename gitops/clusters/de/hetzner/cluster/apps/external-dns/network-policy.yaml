---
apiVersion: "cilium.io/v2"
kind: CiliumNetworkPolicy
metadata:
  name: allow-same-namespace
  namespace: external-dns
spec:
  description: "The external-dns replica's own liveness/readiness and any same-namespace traffic."
  endpointSelector: {}
  ingress:
    - fromEndpoints:
        - matchLabels:
            io.kubernetes.pod.namespace: external-dns
  egress:
    - toEndpoints:
        - matchLabels:
            io.kubernetes.pod.namespace: external-dns
---
apiVersion: "cilium.io/v2"
kind: CiliumNetworkPolicy
metadata:
  name: allow-dns-egress
  namespace: external-dns
spec:
  description: "DNS resolution via CoreDNS -- resolving the Cloudflare API hostname."
  endpointSelector: {}
  egress:
    - toEndpoints:
        - matchLabels:
            k8s-app: kube-dns
            io.kubernetes.pod.namespace: kube-system
      toPorts:
        - ports:
            - port: "53"
              protocol: UDP
            - port: "53"
              protocol: TCP
---
apiVersion: "cilium.io/v2"
kind: CiliumNetworkPolicy
metadata:
  name: allow-kube-apiserver-egress
  namespace: external-dns
spec:
  description: "external-dns watches Gateway API HTTPRoutes, Gateways and EndpointSlices via the API server."
  endpointSelector: {}
  egress:
    - toEntities:
        - kube-apiserver
---
apiVersion: "cilium.io/v2"
kind: CiliumNetworkPolicy
metadata:
  name: allow-cloudflare-api-egress
  namespace: external-dns
spec:
  description: "external-dns syncs records into the willpxxr.com zone via Cloudflare's API (api.cloudflare.com); its IPs aren't a fixed enumerable set, so this allows general internet egress on 443."
  endpointSelector: {}
  egress:
    - toEntities:
        - world
      toPorts:
        - ports:
            - port: "443"
              protocol: TCP
