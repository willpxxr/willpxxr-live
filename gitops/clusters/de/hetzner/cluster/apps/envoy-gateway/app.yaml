# ArgoCD app definition (see argocd/apps-applicationset.yaml + WEP-0001).
# Pinned chart (1.8.2): EG is the Gateway API CRD authority -- see values.yaml.
name: envoy-gateway
namespace: envoy-gateway-system
helm:
  # OCI sources: repoURL is the full artifact path (chart: is ignored by
  # ArgoCD for OCI); credentials match by registry hostname from the
  # argocd-repo-* secrets registered in apps/argocd/values.yaml.
  - repoURL: oci://docker.io/envoyproxy/gateway-helm
    version: 1.8.2
    releaseName: envoy-gateway-system-envoy-gateway
    values: values.yaml
manifests:
  - namespace.yaml
  - network-policy.yaml
