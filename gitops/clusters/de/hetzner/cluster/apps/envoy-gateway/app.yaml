# ArgoCD app definition (see argocd/apps-applicationset.yaml + WEP-0001).
# Pinned chart (1.8.2): EG is the Gateway API CRD authority -- see values.yaml.
name: envoy-gateway
namespace: envoy-gateway-system
helm:
  # OCI: repoURL carries the full artifact path; chart (basename) +
  # targetRevision stay per the Application spec for helm sources.
  # Credentials match by registry hostname via the argocd-repo-* secrets.
  - chart: gateway-helm
    repoURL: oci://docker.io/envoyproxy/gateway-helm
    version: 1.8.2
    releaseName: envoy-gateway-system-envoy-gateway
    values: values.yaml
manifests:
  - namespace.yaml
  - network-policy.yaml
