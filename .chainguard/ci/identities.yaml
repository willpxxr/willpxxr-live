# Trust rings + cache pool for Chainguard Checks (WEP-0017). Ring 2 =
# postsubmit runs on main, the only ring this repo exercises; the owner
# subring exists because the schema requires one.
version: 1
trust:
  groups:
    owner:
      github:
        # Numeric id, not login: the login is only a label.
        user: {willpxxr: 51009659}
  subrings:
    trusted:
      authors: [owner]
  github_token: 1.trusted
  cache:
    trunk:
      rings: [2]
identities:
  octo-sts-probe:
    # GCP-typed solely to get token material into the VM (an ADC config whose
    # credential_source.file points at the bearer); the dummy provider is
    # never contacted -- the probe presents the VM's bearer to octo-sts.dev
    # instead. Read-only, postsubmit-only; see WEP-0017.
    description: Octo STS exchange probe (advisory, read-only GitHub token).
    checks: [ci.checks.octo-sts-probe]
    audiences:
      - https://iam.googleapis.com/projects/123456789012/locations/global/workloadIdentityPools/checks/providers/checks
    gcp:
      provider: projects/123456789012/locations/global/workloadIdentityPools/checks/providers/checks
      audience: https://iam.googleapis.com/projects/123456789012/locations/global/workloadIdentityPools/checks/providers/checks
    allow:
      - run: postsubmit
        ref: refs/heads/main
    ring: 2
