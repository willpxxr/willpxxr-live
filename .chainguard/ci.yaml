# Push-time CI via Chainguard Checks (WEP-0017). Postsubmit checks run on
# every commit landing on main; what the Checks beta can't host (GHCR
# publishes, cron, secrets) stays on GitHub Actions.
version: 1
environment:
  packages: [python-3.13, py3.13-pip]
  caches:
    python: {}
checks:
  checkov:
    description: Checkov misconfiguration scan of terraform/ (report-only; findings appear as annotations on the commit check)
    trigger: postsubmit
    timeout: 10m
    script: |
      # Pinned deliberately; --soft-fail keeps new findings report-only,
      # github_failed_only's ::error lines render as annotations.
      # --skip-download: skip the optional Prisma guideline fetch (hermetic
      # egress; the links were empty anyway). --download-external-modules:
      # also scan inside the hcloud-talos registry module, resolved via
      # registry.terraform.io and fetched from GitHub.
      pip install -q checkov==3.4.3
      checkov --directory terraform --framework terraform --soft-fail \
        --output github_failed_only \
        --skip-download \
        --download-external-modules true
    network:
      egress: [pypi.org, files.pythonhosted.org, registry.terraform.io, github.com]
