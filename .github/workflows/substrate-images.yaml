name: substrate-images

# Builds the Agent Substrate ("ate") images that upstream releases do NOT
# publish (WEP-0016). Since v1.0.0 upstream publishes every install image
# itself -- `publish release-images` pushes ateapi, atecontroller, atelet,
# atenet, ate-idp-server, ateworker-gvisor, ateworker-microvm,
# kubernetes-secrets, objectstore-plugin, podcertcontroller to
# ghcr.io/agent-substrate/substrate, plus the buildx-built envoy-dataplane --
# and install/upgrade runs from upstream's own ate-setup checkout, not from
# these images. What releases still leave out are the demo and tooling
# binaries: this workflow builds exactly those two, minted as probe images:
#
#   - cmd/kubectl-ate   -- the kubectl plugin used by the one-time smoke
#                          probes (releases attach bare binaries only)
#   - demos/counter     -- the Phase-1 exit smoke actor
#
# Rebuilds stay deliberate (the app manifests pin sha256 digests) and fire
# on a committed bump to .github/substrate-ref; workflow_dispatch remains
# as the rebuild-forcing override.
on:
  push:
    branches: ["main"]
    paths: [".github/substrate-ref"]
  workflow_dispatch:
    inputs:
      upstream_ref:
        description: "agent-substrate/substrate tag to build from (defaults to .github/substrate-ref; set only to force-rebuild a ref)"
        required: false
        type: string

permissions: read-all

jobs:
  build-push:
    name: "ko build ${{ inputs.upstream_ref || 'pinned ref' }} -> GHCR"
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write

    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@91182cccc01eb5e619899d80e4e971d6181294a7 # v2.10.1
        with:
          egress-policy: audit

      - name: "Checkout this repo (the pinned-ref file lives here)"
        # The resolve step below reads .github/substrate-ref before the
        # upstream checkout, and the trigger-fired workspace starts empty.
        uses: actions/checkout@11bd71901bbe5b16304ceea73d27597364c9af683 # v4.2.2
        with:
          sparse-checkout: .github
          persist-credentials: false

      - name: "Resolve the upstream ref (dispatch input overrides the pinned file)"
        id: ref
        env:
          INPUT_REF: ${{ inputs.upstream_ref }}
        run: |
          if [ -n "$INPUT_REF" ]; then ref="$INPUT_REF"; else ref="$(cat .github/substrate-ref)"; fi
          echo "building $ref"
          echo "ref=$ref" >> "$GITHUB_OUTPUT"

      - name: "Checkout substrate at the pinned ref"
        # Public upstream: the fetch is anonymous -- the GITHUB_TOKEN's
        # contents scope applies to this repo only and is not consulted
        # for foreign public repos at all.
        uses: actions/checkout@11bd71901bbe5b16304ceea73d27597364c9af683 # v4.2.2
        with:
          repository: agent-substrate/substrate
          ref: ${{ steps.ref.outputs.ref }}
          path: substrate
          persist-credentials: false

      - name: "Setup Go (version from substrate's own go.mod)"
        # The version file keeps this self-updating on ref bumps
        # (v1.0.0's toolchain line drives the choice).
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: substrate/go.mod
          cache-dependency-path: substrate/go.sum

      - name: "Install ko (pinned)"
        run: go install github.com/google/ko@v0.19.1

      - name: "Login to GHCR"
        # ko resolves push credentials from ~/.docker/config.json
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: "ko build the two images upstream releases do not publish"
        working-directory: substrate
        env:
          KO_DOCKER_REPO: ghcr.io/willpxxr
        run: |
          # --base-import-paths: image names = ghcr.io/willpxxr/<cmd> (ko's
          # default naming is <cmd>-<md5 of the import path>, --bare is not
          # usable with multiple targets). ko's help hedges "may not work
          # properly with --tags" for non-default namers -- the first
          # dispatch verified the combination and kept both (2026-10-26).
          set -o pipefail
          ko build \
            --base-import-paths \
            --platform=linux/amd64 \
            --tags="${{ steps.ref.outputs.ref }}" \
            ./cmd/kubectl-ate \
            ./demos/counter \
            | tee "${RUNNER_TEMP}/published.txt"

      - name: "Published digests (render-slice input)"
        run: |
          {
            echo "## substrate images -- ${{ steps.ref.outputs.ref }}"
            echo
            echo '```'
            cat "${RUNNER_TEMP}/published.txt"
            echo '=== published.txt ==='
            cat "${RUNNER_TEMP}/published.txt"
            echo '=== end published.txt ==='
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
